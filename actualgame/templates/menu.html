{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nature's Heroes - Menu</title>

  <!-- Google Font for a modern look -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ---------------- Global Styles ---------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* ---------------- Background Container ---------------- */
    .background-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      overflow: hidden;
    }
    .background-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("{% static 'actualgame/images/gamestart.webp' %}") no-repeat center center;
      background-size: cover;
      filter: blur(10px);
      transform: scale(1.05);
    }
    .background-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ---------------- Foreground (Menu) ---------------- */
    .menu-wrapper {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.8s ease-in-out forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ---------------- Menu Container ---------------- */
    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      width: 400px;
      max-width: 90%;
    }

    /* ---------------- Title Styling with Gradient Text ---------------- */
    .menu-container h1 {
      margin-bottom: 30px;
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #4CAF50 0%, #2E7D32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ---------------- Menu Buttons ---------------- */
    .menu-button {
      display: block;
      margin: 15px auto;
      padding: 15px 25px;
      font-size: 1.2rem;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
      border: none;
      border-radius: 6px;
      width: 200px;
      text-align: center;
      transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .menu-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, #66bb6a 0%, #388e3c 100%);
    }

    /* ---------------- Exit Button: Different Colour ---------------- */
    .exit-button {
      background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
    }
    .exit-button:hover {
      background: linear-gradient(135deg, #EF5350 0%, #C62828 100%);
    }
  </style>
</head>
<body>
  <!-- Blurred Background -->
  <div class="background-container">
    <div class="background-image"></div>
    <div class="background-overlay"></div>
  </div>

  <!-- Foreground Menu -->
  <div class="menu-wrapper">
    <div class="menu-container">
      <a href="{% url 'select_bin' %}" class="menu-button">Select Bin</a>
      <a href="{% url 'rules' %}" class="menu-button">Rules</a>
      <a href="{% url 'rules' %}" class="menu-button">Tutorial</a>
      <a href="{% url 'exit_game' %}" class="menu-button exit-button">Exit</a>
    </div>
  </div>
</body>
</html>
