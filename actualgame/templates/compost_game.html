{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nature's Heroes - Compost Game</title>

  <!-- Main game CSS -->
  <link rel="stylesheet" href="{% static 'actualgame/game.css' %}">

  <!-- TensorFlow.js and COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    /* Disable scrolling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Blurred background container using a pseudo-element */
    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }
    .background-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("{% static 'actualgame/images/gamestart.webp' %}") no-repeat center center;
      background-size: cover;
      filter: blur(10px);
      transform: scale(1.05);
    }

    /* Fixed button container */
    #button-container {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      margin: 0;
    }
    #button-container button {
      margin-right: 10px;
      padding: 8px 12px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Fixed Score Display */
   #score-display {
      font-size: 1.2rem;
      margin: 10px;
      color: #000;
      font-weight: bold;
    }

    /* Voice recognition status */
    #status {
      margin: 10px;
      color: #444;
    }

    /* Modal Styles */
    #camera-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      position: relative;
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    #modal-video-container {
      position: relative;
      width: 400px;
      height: 300px;
      margin: 0 auto;
      border: 2px solid #333;
    }
    #webcam, #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 400px;
      height: 300px;
    }
    #webcam {
      background: #000;
    }
    #overlay {
      pointer-events: none;
      background-color: transparent;
      z-index: 2;
    }
    #detection-info {
      margin-top: 10px;
      color: #d00;
      font-weight: bold;
    }
    .close-btn {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Blurred Background -->
  <div class="background-container"></div>

  <!-- Fixed Button Container for Camera & Voice -->
  <div id="button-container">
    <button id="start-camera-button">Start Camera Detection</button>
    <button id="start-voice-button" onclick="startListening()">Start Voice Recognition</button>
  </div>

  <!-- Fixed Score Display -->
  <div id="score-display">Score: 0</div>

  <!-- Voice Recognition Status -->
  <p id="status"></p>

  <!-- Main Game Area (Visible by default) -->
  <div class="game-area">
    <div class="game-box">
      <!-- Compost Bin Drop Zone -->
      <div class="bin-container">
        <!-- Replace with your compost bin image -->
        <img src="{% static 'actualgame/images/compostbin.pngs' %}" alt="Compost Bin" class="bin-image">
        <!-- Update accepted type to compost -->
        <div class="dropzone" data-accept="compost"></div>
      </div>
      <!-- Draggable Items for Compost -->
      <div class="draggable-items">
        <div class="draggable-item">
          <img src="{% static 'actualgame/images/banana_peel.png' %}"
               alt="Banana Peel"
               class="draggable"
               draggable="true"
               id="item1"
               data-type="compost">
          <p class="product-name">Banana Peel</p>
        </div>
        <div class="draggable-item">
          <img src="{% static 'actualgame/images/apple_core.png' %}"
               alt="Apple Core"
               class="draggable"
               draggable="true"
               id="item2"
               data-type="compost">
          <p class="product-name">Apple Core</p>
        </div>
        <div class="draggable-item">
          <img src="{% static 'actualgame/images/eggshells.png' %}"
               alt="Eggshells"
               class="draggable"
               draggable="true"
               id="item3"
               data-type="compost">
          <p class="product-name">Eggshells</p>
        </div>
        <div class="draggable-item">
          <img src="{% static 'actualgame/images/vegetable_scraps.png' %}"
               alt="Veggie Scraps"
               class="draggable"
               draggable="true"
               id="item4"
               data-type="compost">
          <p class="product-name">Veggie Scraps</p>
        </div>
        <div class="draggable-item">
          <img src="{% static 'actualgame/images/coffee_grounds.png' %}"
               alt="Coffee Grounds"
               class="draggable"
               draggable="true"
               id="item5"
               data-type="compost">
          <p class="product-name">Coffee Grounds</p>
        </div>
        <div class="draggable-item">
          <img src="{% static 'actualgame/images/plastic_item.png' %}"
               alt="Plastic"
               class="draggable"
               draggable="true"
               id="item6"
               data-type="noncompost">
          <p class="product-name">Plastic</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Camera Modal (Hidden until user clicks "Start Camera Detection") -->
  <div id="camera-modal">
    <div class="modal-content">
      <div id="modal-video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <!-- Detection info is placed below the video feed -->
      <div id="detection-info"></div>
      <button class="close-btn" onclick="closeCameraModal()">Close</button>
    </div>
  </div>

  <!-- ========================== GAME SCRIPTS ========================== -->

  <!-- Drag-and-Drop Logic -->
  <script>
    let score = 0;
    function updateScoreDisplay() {
      const scoreDisplay = document.getElementById('score-display');
      if (scoreDisplay) scoreDisplay.textContent = `Score: ${score}`;
    }
    updateScoreDisplay();

    const draggables = document.querySelectorAll('.draggable');
    const dropzone = document.querySelector('.dropzone');

    draggables.forEach(item => {
      item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', item.id);
      });
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('over');
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('over');
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('over');
      const draggedItemId = e.dataTransfer.getData('text/plain');
      const draggedItem = document.getElementById(draggedItemId);
      const itemType = draggedItem.getAttribute('data-type');
      const acceptedType = dropzone.getAttribute('data-accept');
      if (itemType === acceptedType) {
        console.log("Correct drop! Score increased.");
        score += 10;
        const container = draggedItem.parentElement;
        const productName = container.querySelector('.product-name');
        if (productName) productName.remove();
        dropzone.appendChild(draggedItem);
        draggedItem.style.position = 'absolute';
        draggedItem.style.top = '0';
        draggedItem.style.left = '0';
      } else {
        console.log("Incorrect drop! Score deducted.");
        score -= 5;
      }
      updateScoreDisplay();
    });
  </script>

  <!-- Voice Recognition Script -->
  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      const statusElem = document.getElementById('status');
      if (statusElem) statusElem.innerText = "Your browser doesn't support the Web Speech API :(";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const statusElem = document.getElementById('status');
        if (statusElem) statusElem.innerText = "You said: " + transcript;
        const text = transcript.toLowerCase();
        if (text.includes("banana peel")) {
          alert("Banana Peel recognized! It's compostable.");
        } else if (text.includes("apple core")) {
          alert("Apple Core recognized! It's compostable.");
        } else if (text.includes("eggshell")) {
          alert("Eggshell recognized! It's compostable.");
        } else if (text.includes("veggie scraps")) {
          alert("Veggie Scraps recognized! They're compostable.");
        } else if (text.includes("coffee grounds")) {
          alert("Coffee Grounds recognized! They're compostable.");
        } else if (text.includes("plastic")) {
          alert("Plastic recognized! It's not compostable!");
        } else {
          alert("Sorry, I didn't recognize a valid item. Please try again.");
        }
      };
      recognition.onerror = (event) => {
        const statusElem = document.getElementById('status');
        if (statusElem) statusElem.innerText = "Error: " + event.error;
      };
      window.startListening = function() {
        recognition.start();
        const statusElem = document.getElementById('status');
        if (statusElem) statusElem.innerText = "Listening... please speak now.";
      };
    }
  </script>

  <!-- Object Detection + Modal Logic -->
  <script>
    let model;
    let detectionActive = false;
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');

    const CONFIDENCE_THRESHOLD = 0.6;
    const ALPHA = 0.7;
    const previousBoxes = {};

    const CLASS_TO_TYPE = {
      "banana": "compost",
      "apple": "compost",
      "eggshell": "compost",
      "vegetable": "compost",
      "coffee": "compost"
      // Add or adjust mappings as needed
    };

    document.getElementById("start-camera-button").addEventListener("click", loadModel);

    async function loadModel() {
      try {
        model = await cocoSsd.load();
        console.log("Object recognition model loaded.");
        startVideo();
      } catch (error) {
        console.error("Failed to load model:", error);
      }
    }

    async function startVideo() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.onplaying = () => {
          detectionActive = true;
          detectFrame();
          document.getElementById('camera-modal').style.display = 'flex';
        };

        video.play();
      } catch (err) {
        console.error("User denied camera or error accessing webcam:", err);
        document.getElementById('camera-modal').style.display = 'none';
      }
    }

    async function detectFrame() {
      if (!detectionActive) return;
      if (model) {
        const predictions = await model.detect(video);
        console.log("Predictions:", predictions);
        const scaleX = overlay.width / video.videoWidth;
        const scaleY = overlay.height / video.videoHeight;
        drawPredictions(predictions, scaleX, scaleY);
      }
      requestAnimationFrame(detectFrame);
    }

    function drawPredictions(predictions, scaleX, scaleY) {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      let infoText = "";

      predictions.forEach(prediction => {
        if (prediction.score > CONFIDENCE_THRESHOLD) {
          const className = prediction.class.toLowerCase();
          let itemType = "noncompost";
          if (CLASS_TO_TYPE[className] !== undefined) {
            itemType = CLASS_TO_TYPE[className];
          }
          if (!infoText) {
            if (itemType === "compost") {
              infoText = `Detected: ${className} — This is COMPOSTABLE.`;
            } else {
              infoText = `Detected: ${className} — This is NOT COMPOSTABLE.`;
            }
          }

          let bbox = prediction.bbox.slice();
          if (previousBoxes[className]) {
            bbox = smoothBox(bbox, previousBoxes[className]);
          }
          previousBoxes[className] = bbox;

          const x = bbox[0] * scaleX;
          const y = bbox[1] * scaleY;
          const width = bbox[2] * scaleX;
          const height = bbox[3] * scaleY;

          ctx.beginPath();
          ctx.rect(x, y, width, height);
          ctx.lineWidth = 2;
          ctx.strokeStyle = 'red';
          ctx.stroke();

          ctx.font = '10px Arial';
          ctx.fillStyle = 'red';
          ctx.fillText(className, x, y > 10 ? y - 5 : 10);
        }
      });

      const detectionInfo = document.getElementById('detection-info');
      if (detectionInfo) detectionInfo.textContent = infoText;
    }

    function smoothBox(newBox, prevBox) {
      return [
        ALPHA * prevBox[0] + (1 - ALPHA) * newBox[0],
        ALPHA * prevBox[1] + (1 - ALPHA) * newBox[1],
        ALPHA * prevBox[2] + (1 - ALPHA) * newBox[2],
        ALPHA * prevBox[3] + (1 - ALPHA) * newBox[3]
      ];
    }

    function closeCameraModal() {
      document.getElementById('camera-modal').style.display = 'none';
      detectionActive = false;
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      video.srcObject = null;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      document.getElementById('detection-info').textContent = "";
    }
  </script>
</body>
</html>
